name: model-serving-gateway
services:
  redis:
    image: redis:7.0.11-alpine@sha256:121bac949fb5f623b9fa0b4e4c9fb358ffd045966e754cfa3eb9963f3af2fe3b
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 10
  gateway:
    build: .
    platform: linux/arm64
    env_file: ${GATEWAY_ENV_FILE:-.env}
    environment:
      GATEWAY_MODEL_PATH: /models/flan-t5-small
      GATEWAY_REDIS_URL: redis://redis:6379/0
    ports:
      - 127.0.0.1:8093:8093
    volumes:
      - ${MODEL_DIRECTORY:?Set MODEL_DIRECTORY to the verified model directory}:/models/flan-t5-small:ro
      - gateway-data:/data
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
volumes:
  redis-data:
  gateway-data:
